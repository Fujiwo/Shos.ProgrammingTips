<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="C++11 の auto">
  <title>C++11 の auto</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2545"/>
      <stop offset="1" stop-color="#134074"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#background)"/>

  <!-- タイトル -->
  <text x="80" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" fill="#8da9c4">C++11</text>
  <text x="80" y="230" font-family="Consolas, Menlo, monospace" font-size="96" font-weight="bold" fill="#ffffff">auto</text>

  <!-- Before: 長い型名 -->
  <text x="80" y="300" font-family="Consolas, Menlo, monospace" font-size="22" fill="#8da9c4" text-decoration="line-through">std::map&lt;std::string, std::vector&lt;int&gt;&gt;::const_iterator it = scores.find("Alice");</text>

  <!-- After: auto -->
  <text x="80" y="345" font-family="Consolas, Menlo, monospace" font-size="30" fill="#ffd166">auto it = scores.find("Alice");</text>
</svg>
